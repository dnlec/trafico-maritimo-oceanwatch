# This is a Declarative Automation Bundle definition for ocean_watch_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ocean_watch_analytics
  uuid: a186d3a4-23d4-45ff-9608-93223409c99d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
# The notebook widgets catalog, schema and volume default to these values.
# fecha is a notebook widget only (the day to ingest).
# default is a shared schema, so every object is prefixed oceanwatch_.
variables:
  catalog:
    description: Shared Unity Catalog for OceanWatch objects
  schema:
    description: Shared schema; object names are prefixed with oceanwatch_
  volume:
    description: Volume name (not the three-part name) for raw AIS files

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b38f0852-ecf9.cloud.databricks.com/
    cluster_id: 1114-011114-9wt67574
    variables:
      catalog: dbr_acad_ingsistemas_mine
      schema: default
      volume: oceanwatch_data
  prod:
    mode: production
    workspace:
      host: https://dbc-b38f0852-ecf9.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/d.colmenaresm@uniandes.edu.co to make sure we only have a single copy.
      root_path: /Workspace/Users/d.colmenaresm@uniandes.edu.co/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_acad_ingsistemas_mine
      schema: default
      volume: oceanwatch_data
    permissions:
      - user_name: d.colmenaresm@uniandes.edu.co
        level: CAN_MANAGE
