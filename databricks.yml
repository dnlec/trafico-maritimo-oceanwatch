# This is a Declarative Automation Bundle definition for ocean_watch_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ocean_watch_analytics
  uuid: a186d3a4-23d4-45ff-9608-93223409c99d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4ea27343-189f.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-4ea27343-189f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/d.colmenaresm@uniandes.edu.co to make sure we only have a single copy.
      root_path: /Workspace/Users/d.colmenaresm@uniandes.edu.co/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: d.colmenaresm@uniandes.edu.co
        level: CAN_MANAGE
